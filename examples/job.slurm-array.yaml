# LPDI HPC template. Change both /scratch and /work paths on other clusters.
name: whole-human-proteome

target:
  structure: /scratch/shxiao/masif_seed/masif_mimicry/data/input/6h0g.pdb
  pdb_id: 6h0g
  query_chain: C
  receptor_chain: B
  focus: {residue: 423, atom: CA}
  ligand: B:Y70

database:
  name: masif_human_proteome
  protein_list: /scratch/shxiao/masif_seed/masif/data/masif_human_proteome/lists/hp_list.txt

search:
  preset: balanced
  count_clashes: true

postprocessing:
  enabled: false

runtime:
  backend: slurm
  suite_root: /scratch/shxiao/masif_seed
  image: /scratch/shxiao/masif_seed/masif_mimicry/masif_mimicry.sif
  # The database path under suite_root is a symlink to this real directory.
  binds:
    - /work/lpdi/users/shxiao/masif_seed/masif/data/masif_human_proteome_domains_merged
  submit: true
  slurm:
    nodes: 1
    qos: serial
    ntasks_per_node: 1
    job_name: benchmark
    array_tasks: 5
    cpus: 2
    memory: 10g
    time: "24:00:00"
    output: logs/%x-%A_%a.out
    # array_max_parallel: 50

output_root: /scratch/shxiao/masif_seed/masif_mimicry/runs
