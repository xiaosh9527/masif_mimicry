# Replace /shared/path with storage visible on the login and compute nodes.
name: whole-human-proteome

target:
  structure: /shared/path/masif_seed/masif_mimicry/data/template/input/6h0g.pdb
  pdb_id: 6h0g
  query_chain: C
  receptor_chain: B
  focus: {residue: 423, atom: CA}
  ligand: B:Y70

database:
  name: masif_human_proteome
  protein_list: /shared/path/masif_seed/masif/data/masif_human_proteome/lists/processed-proteins.txt

search:
  preset: balanced
  count_clashes: true

postprocessing:
  enabled: false

runtime:
  backend: slurm
  suite_root: /shared/path/masif_seed
  image: /shared/path/masif_seed/masif_mimicry/masif_mimicry.sif
  # Add resolved external-storage roots when database paths are symlinks.
  binds: []
  submit: true
  slurm:
    nodes: 1
    qos: serial
    ntasks_per_node: 1
    job_name: benchmark
    array_tasks: 5
    cpus: 2
    memory: 10g
    time: "24:00:00"
    output: logs/%x-%A_%a.out
    # array_max_parallel: 50

output_root: /shared/path/masif_seed/masif_mimicry/runs
